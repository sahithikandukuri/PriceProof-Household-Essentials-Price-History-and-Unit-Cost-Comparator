<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Products — PriceProof Admin</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/themes.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <span>🌱 Price<span class="highlight">Proof</span> <span style="font-size:0.75rem; background:var(--color-accent); color:#fff; padding:2px 8px; border-radius:var(--radius-full); margin-left:6px;">ADMIN</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="/admin/dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="/admin/products.html" class="nav-link active">Products</a></li>
        <li><a href="/admin/prices.html" class="nav-link">Price Logger</a></li>
        <li><a href="/admin/imports.html" class="nav-link">Batch Feeds</a></li>
      </ul>

      <div class="nav-actions">
        <button class="theme-toggle-btn btn-icon" onclick="window.ThemeManager?.toggleTheme()">🌙</button>
        <div id="nav-auth-links" style="display:flex; align-items:center; gap:var(--space-sm);"></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding: var(--space-xl) var(--space-md);" id="admin-container">
    <div style="margin-bottom: var(--space-xl); display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:var(--space-md);">
      <div>
        <h1 style="font-size: 2.2rem;">Product Catalog Management</h1>
        <p>Register new canonical grocery items and packaging variants</p>
      </div>
      <a href="/admin/dashboard.html" class="btn btn-outline btn-sm">&larr; Back to Dashboard</a>
    </div>

    <!-- Product Creation Form Card -->
    <div style="background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--space-xl); max-width:800px; box-shadow:var(--shadow-sm); margin-bottom:var(--space-2xl);">
      <h3 style="margin-bottom:var(--space-md);">Create New Canonical Product</h3>

      <form id="create-product-form">
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:var(--space-md);">
          <div class="form-group">
            <label class="form-label" for="new-product-name">Product Name *</label>
            <input type="text" id="new-product-name" class="form-input" placeholder="e.g. Daawat Traditional Basmati Rice" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="new-product-category">Category *</label>
            <select id="new-product-category" class="form-select" required></select>
          </div>

          <div class="form-group">
            <label class="form-label" for="new-product-brand">Brand</label>
            <select id="new-product-brand" class="form-select"></select>
          </div>

          <div class="form-group">
            <label class="form-label" for="new-product-img">Image URL</label>
            <input type="url" id="new-product-img" class="form-input" placeholder="https://images.unsplash.com/..." />
          </div>
        </div>

        <div class="form-group" style="margin-top:var(--space-sm);">
          <label class="form-label" for="new-product-desc">Product Description</label>
          <textarea id="new-product-desc" class="form-input" rows="2" placeholder="Brief details about quality and usage"></textarea>
        </div>

        <div style="margin-top:var(--space-md); padding-top:var(--space-md); border-top:1px solid var(--color-border);">
          <h4 style="margin-bottom:var(--space-sm); font-size:1.05rem;">Default Packaging Variant</h4>
          <div style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:var(--space-md);">
            <div class="form-group">
              <label class="form-label">Variant Name *</label>
              <input type="text" id="new-variant-name" class="form-input" placeholder="e.g. 1 kg Pouch" required />
            </div>
            <div class="form-group">
              <label class="form-label">Quantity *</label>
              <input type="number" step="0.001" min="0.001" id="new-variant-qty" class="form-input" placeholder="1" required />
            </div>
            <div class="form-group">
              <label class="form-label">Unit *</label>
              <select id="new-variant-unit" class="form-select" required>
                <option value="kg">kg (Kilogram)</option>
                <option value="g">g (Gram)</option>
                <option value="l">l (Litre)</option>
                <option value="ml">ml (Millilitre)</option>
                <option value="piece">piece</option>
                <option value="pack">pack</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:var(--space-md);">Save & Publish Product</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
