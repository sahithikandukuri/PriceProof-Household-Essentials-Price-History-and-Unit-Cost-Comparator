<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — PriceProof</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/themes.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <!-- Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <span>🌱 Price<span class="highlight">Proof</span></span>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle-btn btn-icon" onclick="window.ThemeManager?.toggleTheme()">🌙</button>
      </div>
    </div>
  </header>

  <main class="container" style="flex:1; display:flex; align-items:center; justify-content:center; padding: var(--space-2xl) var(--space-md);">
    <div style="background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--space-2xl); width:100%; max-width:440px; box-shadow:var(--shadow-md);">
      <h2 style="font-size: 1.8rem; margin-bottom: var(--space-xs);">Welcome Back</h2>
      <p style="margin-bottom: var(--space-lg); font-size: 0.95rem;">Sign in to access your shopping lists, wishlist, and alerts.</p>

      <div id="auth-error-box" style="display:none; padding:var(--space-sm) var(--space-md); background:var(--color-error-bg); color:var(--color-error); border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:var(--space-md);"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required />
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-md);">Sign In</button>
      </form>

      <div style="margin-top: var(--space-lg); text-align: center; font-size: 0.9rem;">
        Don't have an account? <a href="/register.html">Create one for free</a>
      </div>

      <div style="margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--color-border); font-size: 0.8rem; color: var(--color-text-muted); text-align: center;">
        Demonstration Hint: Sign in with any email (or use an admin email like <code>admin@priceproof.in</code>) to test role-based management.
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const errBox = document.getElementById('auth-error-box');
      const btn = document.getElementById('login-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        btn.textContent = 'Signing in...';
        btn.disabled = true;

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          await window.AuthManager.signIn(email, password);
          window.showToast('Signed in successfully!');
          setTimeout(() => {
            window.location.href = window.AuthManager.isAdmin() ? '/admin/dashboard.html' : '/products.html';
          }, 800);
        } catch (err) {
          errBox.textContent = err.message || 'Failed to sign in. Please check your credentials.';
          errBox.style.display = 'block';
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
